<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room for Everly</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #090b12; font-family: system-ui, sans-serif; color: #fbe3ec; }
  canvas { display: block; }
  #label { position: fixed; left: 16px; top: 12px; }
  #label h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #label p { margin: 2px 0 8px; font-size: 13px; opacity: .7; }
  #transport { position: fixed; left: 16px; bottom: 14px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  #clock { font-size: 13px; font-variant-numeric: tabular-nums; margin-right: 8px; opacity: .85; min-width: 11.5em; }
  button { font: inherit; font-size: 13px; padding: 5px 10px; margin-right: 4px; color: #fff1f5; border: 1px solid rgba(255,214,228,.45); border-radius: 999px; background: rgba(110,62,84,.55); cursor: pointer; }
  button:hover { background: rgba(170,96,128,.7); }
  button[aria-pressed="true"] { background: rgba(232,130,166,.8); }
  #begin { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,6,10,.35); }
  #begin button { font-size: 16px; padding: 12px 24px; background: rgba(214,112,150,.9); }
  #begin small { display: block; margin-top: 4px; font-size: 12px; opacity: .7; }
  #feelings { margin-top: 6px; font-size: 13px; }
  #feelings span { opacity: .7; margin-right: 6px; }
  #hint { position: fixed; transform: translate(-50%, -100%); padding: 4px 10px; border-radius: 999px; font-size: 13px; white-space: nowrap; pointer-events: none;
          color: #5a2a3c; background: rgba(255, 246, 214, .92); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
} }
</script>
</head>
<body>
<div id="label">
  <h1>Room for Everly</h1>
  <p>Arrow keys walk the squirrel · Space picks up, puts down, opens and switches · drag to rotate · scroll to zoom</p>
  <button data-view="overview">Overview</button><button data-view="living">Living room</button><button data-view="bedroom">Bedroom</button><button data-view="bathroom">Bathroom</button><button data-view="kids">Kids' room</button><button data-view="plan">Floor plan</button><button data-view="squirrel">Squirrel</button>
  <div id="feelings"><span>Feelings (1–5)</span><button data-feel="happy">😊 Happy</button><button data-feel="sad">😢 Sad</button><button data-feel="angry">😠 Angry</button><button data-feel="bored">😑 Bored</button><button data-feel="sleepy">😴 Sleepy</button></div>
</div>
<div id="hint" hidden></div>
<div id="transport" hidden>
  <span id="clock"></span>
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <button data-speed="1">Real time</button><button data-speed="20">20×</button><button data-speed="60">60×</button>
  <button id="sound">Sound on</button>
</div>
<div id="begin"><button>Begin the sunrise<small>with music · one minute before the sun comes up</small></button></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// Bump ?v= whenever src/ changes: it stops a browser pairing this page with an older cached module.
import { createPipeline } from './src/pipeline.js?v=3';
import { buildScene, views, SUNRISE } from './src/scene.js?v=3';
import { createMusic } from './src/audio.js?v=3';
import { createSquirrel } from './src/squirrel.js?v=3';
import { createWalker } from './src/walk.js?v=3';
import { createFeelings } from './src/feelings.js?v=3';
import { createInteraction } from './src/interact.js?v=3';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 100);
const pipeline = createPipeline(scene, camera);
const room = buildScene(scene, pipeline.renderer);
const music = createMusic();
pipeline.hideFromAO.push(...room.hideFromAO);

// Everly's squirrel, standing on the round rug in the kids' room, turned towards the door
const squirrel = createSquirrel();
squirrel.group.position.set(6.9 - 4.7, 0.014, 12.15 - 6.8);
squirrel.group.rotation.y = -0.93;
scene.add(squirrel.group);
pipeline.hideFromAO.push(...squirrel.parts.zzz.children);
window.__squirrel = squirrel;

const controls = new OrbitControls(camera, pipeline.renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.minDistance = 0.5;
controls.maxDistance = 26;
controls.addEventListener('change', () => pipeline.invalidate());

// Lamps: a click (not a drag) on a lamp switches it on or off.
const canvas = pipeline.renderer.domElement, pointer = new THREE.Vector2(), ray = new THREE.Raycaster();
function lampUnder(e) {
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObjects(room.lamps.map(l => l.proxy))[0];
  return hit && room.lamps.find(l => l.proxy === hit.object);
}
let pressedAt = null;
canvas.addEventListener('pointerdown', e => { pressedAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!pressedAt || Math.hypot(e.clientX - pressedAt[0], e.clientY - pressedAt[1]) > 5) return;
  const lamp = lampUnder(e);
  if (lamp) { room.setLamp(lamp, !lamp.on); pipeline.invalidate(); }
});
canvas.addEventListener('pointermove', e => { if (!e.buttons) canvas.style.cursor = lampUnder(e) ? 'pointer' : ''; });
window.__lamps = () => room.lamps.map(l => l.on);   // console helper: which lamps are on

// The arrow keys walk the squirrel; the camera follows her.
const walker = createWalker({
  squirrel, scene, renderer: pipeline.renderer, camera, controls,
  hidden: [...pipeline.hideFromAO, ...room.lamps.map(l => l.proxy)],
});
window.__walker = walker;

// How she feels: the buttons (or keys 1 to 5) set a feeling; things that happen set others.
const feelings = createFeelings(squirrel, mood => {
  document.querySelectorAll('[data-feel]').forEach(b => b.setAttribute('aria-pressed', b.dataset.feel === mood));
});
document.querySelectorAll('[data-feel]').forEach(b => b.onclick = () => feelings.set(b.dataset.feel));
addEventListener('keydown', e => {
  const n = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5'].indexOf(e.code);
  if (n >= 0 && !e.metaKey && !e.ctrlKey) feelings.set(['happy', 'sad', 'angry', 'bored', 'sleepy'][n]);
});
// Space: pick up, put down, open, shut, switch on and off
const interaction = createInteraction({ room, squirrel, walker, scene, camera, pipeline, feelings, hint: document.getElementById('hint') });
window.__room = room;
window.__feelings = feelings;
window.__interaction = interaction;
// a button keeps the keyboard after a click, and Space would press it again: let go of it
document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => b.blur()));   // console helper: __walker.isFree(x, z) says whether she fits there

// Behind the squirrel, looking the way she faces, so the up arrow walks her straight on.
// If furniture or a wall is in the way there, swing round her until the view is clear.
function squirrelView() {
  const s = squirrel.group.position, a0 = squirrel.group.rotation.y;
  for (const turn of [0, 0.5, -0.5, 1, -1, 1.5, -1.5, 2, -2, 2.6, -2.6, Math.PI]) {
    for (const d of [2.1, 1.6, 1.2]) {
      const a = a0 + turn, ok = [1, 0.75, 0.5].every(f => walker.isFree(s.x - Math.sin(a) * d * f, s.z - Math.cos(a) * d * f, 0.12));
      if (ok) return [[s.x - Math.sin(a) * d, 1.45, s.z - Math.cos(a) * d], [s.x, 0.5, s.z]];
    }
  }
  return [[s.x, 3, s.z + 0.01], [s.x, 0.5, s.z]];
}
function setView(name, custom) {
  const [p, t] = custom || (name === 'squirrel' ? squirrelView() : views[name]);
  camera.position.set(...p);
  controls.target.set(...t);
  controls.update();
  pipeline.invalidate();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
setView('overview');
window.__look = (position, target) => setView(null, [position, target]);   // console helper: aim the camera anywhere

// ---------- the sunrise ----------
// `minutes` is time relative to sunrise. `speed` is how many times faster than
// real life it runs. `breeze` is real seconds of wind, which always runs at 1x.
const $ = id => document.getElementById(id);
let minutes = SUNRISE.start, speed = 20, playing = false, breeze = 0, last = performance.now(), tick = 0;

function applySun() {
  const { exposure, progress } = room.setSun(minutes);
  pipeline.renderer.toneMappingExposure = exposure;
  music.setProgress(progress);
  const s = Math.round(Math.abs(minutes) * 60), mmss = `${s / 60 | 0}:${String(s % 60).padStart(2, '0')}`;
  $('clock').textContent = minutes < 0 ? `${mmss} before sunrise` : `Sunrise + ${mmss}`;
}
// The shadow map and the beams' depth map are redrawn on alternate frames: both
// only change slowly, and this halves what a moving sun and curtain cost.
function refreshLight() {
  if (tick++ % 2) pipeline.renderer.shadowMap.needsUpdate = true;
  else room.renderSunDepth();
  pipeline.setVolumetric(room.volumetric);
}
function setSpeed(x) {
  speed = x;
  document.querySelectorAll('[data-speed]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.speed === x));
}
function setPlaying(on) {
  playing = on;
  last = performance.now();
  $('play').textContent = on ? 'Pause' : 'Play';
  music.setPlaying(on);
}

applySun();
pipeline.renderer.shadowMap.needsUpdate = true;
pipeline.setVolumetric(room.volumetric);
setSpeed(speed);

$('begin').onclick = () => {
  $('begin').remove();
  $('transport').hidden = false;
  music.start();
  setPlaying(true);
};
$('play').onclick = () => setPlaying(!playing);
$('restart').onclick = () => { minutes = SUNRISE.start; music.restart(); applySun(); refreshLight(); refreshLight(); pipeline.invalidate(); };
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => setSpeed(+b.dataset.speed));
let soundOn = true;
$('sound').onclick = () => { soundOn = !soundOn; music.setMuted(!soundOn); $('sound').textContent = soundOn ? 'Sound on' : 'Sound off'; };

let frame = 0;
pipeline.start(() => {
  const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  // The squirrel is always a little alive (her tail waves), so every frame is drawn;
  // her shadow is redrawn every other frame.
  const step = walker.update(dt, { mood: feelings.mood, carry: interaction.carry });
  feelings.update(dt, step);
  // doors, wardrobes and the fridge glide open and shut; once one stops, her map is redrawn
  if (room.update(dt).some(it => it.verbs[0] === 'open')) walker.refresh();
  interaction.update(dt);
  controls.update();
  if (frame++ % 2) pipeline.renderer.shadowMap.needsUpdate = true;
  breeze += dt;                                                    // curtains at an open window blow
  const gust = room.setWind(breeze, Math.min(1, breeze / 8));      // the breeze picks up over the first few seconds
  pipeline.invalidate();
  if (!playing) return;                       // paused: the sun stands still
  minutes = Math.min(SUNRISE.end, minutes + dt * speed / 60);
  applySun();
  music.setGust(gust);
  refreshLight();
  pipeline.invalidate();
});

// console helper: jump to a moment, e.g. __at(12) for twelve minutes after sunrise
window.__at = (m, wind = breeze) => { minutes = m; breeze = wind; applySun(); room.setWind(breeze, 1); refreshLight(); refreshLight(); pipeline.invalidate(); };
</script>
</body>
</html>
